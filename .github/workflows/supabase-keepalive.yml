name: Supabase keepalive

# Free-tier Supabase projects are paused after 7 days without activity.
# Run a tiny read against the database twice a week to stay well inside that window.
on:
  schedule:
    - cron: '17 3 * * 1,4' # Mon & Thu 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_KEY secrets are not set"
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/prompts?select=id&limit=1")

          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keepalive failed with HTTP $status"
            exit 1
          fi
